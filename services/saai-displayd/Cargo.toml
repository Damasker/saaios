[package]
name = "saai-displayd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[example]]
name = "dmabuf_probe"
required-features = ["panther-hardware"]

[features]
default = []
# Real DRM/KMS output + raw evdev touch input for the physical Pixel 7
# (S03). Off by default so the headless S02 tests keep building on a plain
# CI runner without libdrm installed -- see
# docs/adr/ADR-008-cross-compiling-drm-backend-c-deps.md for why libdrm
# needs to be built from source for aarch64-unknown-linux-musl, and
# ADR-011-raw-evdev-touch.md for why touch input doesn't go through
# libinput/libudev (backend_udev/backend_libinput are deliberately not
# enabled here even though ADR-008 built those libraries too).
panther-hardware = ["smithay/backend_drm"]

[dependencies]
calloop = { version = "0.14", features = ["signals"] }
nix = { version = "0.31", features = ["fs", "socket", "uio"] }
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "desktop"] }
sha2 = "0.10"
# Qt 5.15 / Qt 6.6 speak zwp_text_input_v2 (KDE protocol), not v3.
wayland-protocols-plasma = { version = "0.3", features = ["server"] }

[dev-dependencies]
tempfile = "3"
# Only for the wl_data_device_manager registry-presence test (ADR-021),
# native clipboard deny (ADR-294), the text-input-v3 bind/enable/commit
# test (ADR-022), the wp-fractional-scale-v1 preferred_scale test
# (ADR-266), the input-method-v2 commit_string test (ADR-267), the
# APP-04 OSK two-client test (ADR-270), the layer-shell size test
# (ADR-271), and the GDK shm scale test (ADR-286) -- a plain client
# connecting to the real spawned saai-displayd binary, the same way
# saai-demo-surface and saai-shell already do in production.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client", "server"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# APP-04: OSK keystrokes are saai-ui-core Keyboard actions, not a second map.
# APP-02 host GTK4 frame (ADR-305) spawns tests/gtk4_hello.py; not a crate dep.
# APP-06 host Falkon frame (ADR-306) spawns packed aarch64 falkon via qemu.
# APP-02 configure_bounds (ADR-311) is the window geometry, not (0,0).
# APP-04 text-input-v2 (ADR-319) is the Qt protocol; v3 stays for GTK.
# APP-02 Alpine GTK 4.14.4 qemu frame (ADR-320) needs GTK4_ALPINE_PROBE.
# APP-04 packed PCManFM-Qt v2 enable (ADR-323) needs PCMANFM_PACKAGE_DIR.
# APP-04 IME commit_string into that field (ADR-324) uses the same package.
# APP-04 host GTK 4.18 Entry types hi! via IME (ADR-325).
# APP-04 PathEdit click re-enables v2; still no new shm (ADR-327).
# APP-04 host Qt 5.15 QLineEdit types hi! via IME (ADR-328).
# APP-04 packed PCManFM OSK commit+delete after PathEdit click (ADR-329).
# APP-04 packed musl Qt 5.15 QLineEdit types hi! via IME (ADR-330).
# APP-04 packed PCManFM Filter-band click still no shm paint (ADR-331).
# APP-04 packed Falkon URL click enables v2; IME commit_string (ADR-333).
# APP-04 packed Falkon URL OSK hi! reaches v2 (ADR-334).
# APP-04 packed Falkon URL OSK still no new shm (ADR-335).
# APP-04 packed musl Qt 6.6.3 QLineEdit types hi! via IME (ADR-336).
# APP-04 packed Falkon URL v2 disables before update_state settle (ADR-337).
saai-ui-core = { path = "../../crates/saai-ui-core" }
