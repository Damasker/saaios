[package]
name = "saai-displayd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# Real DRM/KMS output + raw evdev touch input for the physical Pixel 7
# (S03). Off by default so the headless S02 tests keep building on a plain
# CI runner without libdrm installed -- see
# docs/adr/ADR-008-cross-compiling-drm-backend-c-deps.md for why libdrm
# needs to be built from source for aarch64-unknown-linux-musl, and
# ADR-011-raw-evdev-touch.md for why touch input doesn't go through
# libinput/libudev (backend_udev/backend_libinput are deliberately not
# enabled here even though ADR-008 built those libraries too).
panther-hardware = ["smithay/backend_drm"]

[dependencies]
calloop = { version = "0.14", features = ["signals"] }
nix = { version = "0.31", features = ["socket"] }
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "desktop"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# Only for the wl_data_device_manager registry-presence test (ADR-021) and
# the text-input-v3 bind/enable/commit test (ADR-022) -- a plain client
# connecting to the real spawned saai-displayd binary, the same way
# saai-demo-surface and saai-shell already do in production.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
