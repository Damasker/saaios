[package]
name = "saai-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fontdue = { version = "0.9.3", default-features = false }
# Only for SO_PEERCRED (`getsockopt(.., PeerCredentials)`) in
# portal_server.rs -- std's own UnixStream::peer_cred() exists but is still
# behind the unstable `peer_credentials_unix_socket` feature on this
# toolchain (tracking issue #42839), so this crate covers the same syscall
# on stable instead of waiting on that to land.
nix = { version = "0.31", features = ["socket"] }
saai-app-protocol.workspace = true
saai-entity-protocol.workspace = true
saai-portal-protocol.workspace = true
saai-ui-core.workspace = true
serde_json.workspace = true
uuid.workspace = true
# xkbcommon disabled: no physical keyboard on this device (ADR-012 made
# the same call for saai-displayd) -- pulling it in here would carry the
# same crash risk and image-size cost ADR-013 had to work around, for a
# capability this shell doesn't use.
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }

[build-dependencies]
saai-ui-compiler.workspace = true

[dev-dependencies]
chrono.workspace = true
saai-entity-store.workspace = true
tempfile.workspace = true
