[package]
name = "saai-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fontdue = { version = "0.9.3", default-features = false }
# Only for SO_PEERCRED (`getsockopt(.., PeerCredentials)`) in
# portal_server.rs -- std's own UnixStream::peer_cred() exists but is still
# behind the unstable `peer_credentials_unix_socket` feature on this
# toolchain (tracking issue #42839), so this crate covers the same syscall
# on stable instead of waiting on that to land.
nix = { version = "0.31", features = ["socket"] }
# S26 follow-up: a real fingerprint for the pairing consent screen
# (docs/os/ideas.md) -- SHA256 over the key blob's decoded bytes,
# same convention ssh-keygen -l already shows, not the project's own
# invention.
base64.workspace = true
sha2.workspace = true
saai-app-protocol.workspace = true
saai-entity-protocol.workspace = true
saai-portal-protocol.workspace = true
saai-ui-core.workspace = true
serde_json.workspace = true
uuid.workspace = true
# xkbcommon disabled: no physical keyboard on this device (ADR-012 made
# the same call for saai-displayd) -- pulling it in here would carry the
# same crash risk and image-size cost ADR-013 had to work around, for a
# capability this shell doesn't use.
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
# ADR-024 continued: GPU-native linux-dmabuf status bar canvas
# (dmabuf_canvas.rs) -- DRM dumb-buffer allocation + PRIME export, same
# technique already proven on device by saai-displayd's own examples/
# dmabuf_probe.rs. Depends on `drm` directly, NOT `smithay` (which
# dmabuf_probe.rs itself uses, since saai-displayd already needs the
# full crate as a compositor): smithay pulls in xkbcommon
# unconditionally regardless of feature flags, which this crate has
# deliberately avoided from the start (no physical keyboard on this
# device, same crash-risk/image-size reasoning as ADR-012/013) -- it
# broke the real aarch64-musl static cross-build at link time with a
# missing libxkbcommon.a even though `cargo check` on the host target
# never caught it.
drm = "0.14"
wayland-protocols = { version = "0.32", features = ["client"] }

[build-dependencies]
saai-ui-compiler.workspace = true

[dev-dependencies]
chrono.workspace = true
saai-entity-store.workspace = true
tempfile.workspace = true
