name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: S01 headless Wayland vertical slice
        run: cargo test -p saai-displayd --test wayland_slice -- --nocapture
      - name: e2e
        run: cargo test -p diagnose-slow-system -- --nocapture
