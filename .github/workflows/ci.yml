name: ci

on:
  push:
  pull_request:

jobs:
  modem-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: modem parser and model tests
        run: cargo test -p saai-modemd --lib
      - name: modem diagnostic framing fixtures (host only)
        run: |
          cc -O2 -Wall -Wextra -Werror \
            os/targets/panther/diagnostics/modem-channel-owner.c \
            -o /tmp/modem-channel-owner-fixture
          /tmp/modem-channel-owner-fixture self-test
          test "$(/tmp/modem-channel-owner-fixture --mode)" = passive
          cc -O2 -Wall -Wextra -Werror -DSAAIOS_SCAN_ONCE \
            os/targets/panther/diagnostics/modem-channel-owner.c \
            -o /tmp/modem-channel-owner-scan-fixture
          /tmp/modem-channel-owner-scan-fixture self-test
          test "$(/tmp/modem-channel-owner-scan-fixture --mode)" = scan-once
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -DRFS_HOST_TEST \
            os/targets/panther/diagnostics/modem-rfs-one-grant-owner.c \
            -o /tmp/modem-rfs-one-grant-owner-fixture
          /tmp/modem-rfs-one-grant-owner-fixture self-test
          test "$(/tmp/modem-rfs-one-grant-owner-fixture --mode)" = rfs-one-grant
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -DRFS_HOST_TEST \
            os/targets/panther/diagnostics/modem-rfs-full-quarantine-owner.c \
            -o /tmp/modem-rfs-full-quarantine-owner-fixture
          /tmp/modem-rfs-full-quarantine-owner-fixture self-test
          test "$(/tmp/modem-rfs-full-quarantine-owner-fixture --mode)" = rfs-full-quarantine
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer -DRFS_HOST_TEST \
            os/targets/panther/diagnostics/modem-rfs-full-quarantine-owner.c \
            -o /tmp/modem-rfs-full-quarantine-owner-san
          /tmp/modem-rfs-full-quarantine-owner-san self-test
          sh -n os/targets/panther/diagnostics/owner-handoff-bringup.sh
          sh -n os/targets/panther/diagnostics/build-owner-scan-once.sh
          sh -n os/targets/panther/diagnostics/build-rfs-one-grant-owner.sh
          sh -n os/targets/panther/diagnostics/build-probe-rfs-one-grant.sh
          sh -n os/targets/panther/diagnostics/build-rfs-full-quarantine-owner.sh
          sh -n os/targets/panther/diagnostics/build-probe-rfs-full-quarantine.sh
          sh -n os/targets/panther/diagnostics/verify-original-efs-readonly.sh
          cc -O2 -Wall -Wextra -Werror \
            os/targets/panther/diagnostics/ready-network-once.c \
            -o /tmp/ready-network-once-fixture
          /tmp/ready-network-once-fixture self-test
          cc -O2 -Wall -Wextra -Werror \
            os/targets/panther/diagnostics/rfs-error-probe.c \
            -o /tmp/rfs-error-probe-fixture
          /tmp/rfs-error-probe-fixture --fixture
          cc -O2 -Wall -Wextra -Werror \
            os/targets/panther/diagnostics/sit-unsol-observe.c \
            -o /tmp/sit-unsol-observe-fixture
          /tmp/sit-unsol-observe-fixture self-test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: quarantined RFS protocol model (synthetic host data only)
        run: node --test os/targets/panther/diagnostics/rfs-quarantine-host.test.mjs
      - name: TD1A network scan state model (synthetic host data only)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -DSAAIOS_NETWORK_SCAN_HOST_ONLY \
            os/targets/panther/diagnostics/sit-network-scan-host.c \
            os/targets/panther/diagnostics/sit-network-scan-host.test.c \
            -o /tmp/sit-network-scan-host-test
          /tmp/sit-network-scan-host-test
      - name: TD1A network scan state model sanitizers
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DSAAIOS_NETWORK_SCAN_HOST_ONLY \
            os/targets/panther/diagnostics/sit-network-scan-host.c \
            os/targets/panther/diagnostics/sit-network-scan-host.test.c \
            -o /tmp/sit-network-scan-host-san
          /tmp/sit-network-scan-host-san
      - name: quarantined RFS C core (synthetic host data only)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -DRFS_QUARANTINE_HOST_ONLY \
            os/targets/panther/diagnostics/rfs-quarantine-core-host.c \
            os/targets/panther/diagnostics/rfs-quarantine-core-host.test.c \
            -o /tmp/rfs-quarantine-core-host-test
          /tmp/rfs-quarantine-core-host-test
      - name: quarantined RFS C core sanitizers
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DRFS_QUARANTINE_HOST_ONLY \
            os/targets/panther/diagnostics/rfs-quarantine-core-host.c \
            os/targets/panther/diagnostics/rfs-quarantine-core-host.test.c \
            -o /tmp/rfs-quarantine-core-host-san
          /tmp/rfs-quarantine-core-host-san
      - name: quarantined RFS transport (synthetic Linux host only)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -DRFS_QUARANTINE_HOST_ONLY \
            os/targets/panther/diagnostics/rfs-quarantine-core-host.c \
            os/targets/panther/diagnostics/rfs-quarantine-transport-host.c \
            os/targets/panther/diagnostics/rfs-quarantine-transport-host.test.c \
            -o /tmp/rfs-quarantine-transport-host-test
          /tmp/rfs-quarantine-transport-host-test
      - name: quarantined RFS transport sanitizers
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DRFS_QUARANTINE_HOST_ONLY \
            os/targets/panther/diagnostics/rfs-quarantine-core-host.c \
            os/targets/panther/diagnostics/rfs-quarantine-transport-host.c \
            os/targets/panther/diagnostics/rfs-quarantine-transport-host.test.c \
            -o /tmp/rfs-quarantine-transport-host-san
          /tmp/rfs-quarantine-transport-host-san
      - name: quarantined RFS private storage (Linux host only)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -DRFS_QUARANTINE_HOST_ONLY -DRQ_STORAGE_HOST_TEST \
            os/targets/panther/diagnostics/rfs-quarantine-core-host.c \
            os/targets/panther/diagnostics/rfs-quarantine-storage-host-linux.c \
            os/targets/panther/diagnostics/rfs-quarantine-storage-host-linux.test.c \
            -o /tmp/rfs-quarantine-storage-host-test
          /tmp/rfs-quarantine-storage-host-test
      - name: quarantined RFS private storage sanitizers
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DRFS_QUARANTINE_HOST_ONLY -DRQ_STORAGE_HOST_TEST \
            os/targets/panther/diagnostics/rfs-quarantine-core-host.c \
            os/targets/panther/diagnostics/rfs-quarantine-storage-host-linux.c \
            os/targets/panther/diagnostics/rfs-quarantine-storage-host-linux.test.c \
            -o /tmp/rfs-quarantine-storage-host-san
          /tmp/rfs-quarantine-storage-host-san
      - name: quarantined RFS transport and storage integration
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -DRFS_QUARANTINE_HOST_ONLY -DRQ_STORAGE_HOST_TEST \
            os/targets/panther/diagnostics/rfs-quarantine-core-host.c \
            os/targets/panther/diagnostics/rfs-quarantine-storage-host-linux.c \
            os/targets/panther/diagnostics/rfs-quarantine-transport-host.c \
            os/targets/panther/diagnostics/rfs-quarantine-integration-host.test.c \
            -o /tmp/rfs-quarantine-integration-host-test
          /tmp/rfs-quarantine-integration-host-test
      - name: quarantined RFS integration sanitizers
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DRFS_QUARANTINE_HOST_ONLY -DRQ_STORAGE_HOST_TEST \
            os/targets/panther/diagnostics/rfs-quarantine-core-host.c \
            os/targets/panther/diagnostics/rfs-quarantine-storage-host-linux.c \
            os/targets/panther/diagnostics/rfs-quarantine-transport-host.c \
            os/targets/panther/diagnostics/rfs-quarantine-integration-host.test.c \
            -o /tmp/rfs-quarantine-integration-host-san
          /tmp/rfs-quarantine-integration-host-san
      - name: quarantined RFS independently pinned source fd
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -DRFS_QUARANTINE_HOST_ONLY \
            os/targets/panther/diagnostics/rfs-quarantine-core-host.c \
            os/targets/panther/diagnostics/rfs-quarantine-source-host-linux.c \
            os/targets/panther/diagnostics/rfs-quarantine-source-host-linux.test.c \
            -o /tmp/rfs-quarantine-source-host-test
          /tmp/rfs-quarantine-source-host-test
      - name: quarantined RFS source fd sanitizers
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DRFS_QUARANTINE_HOST_ONLY \
            os/targets/panther/diagnostics/rfs-quarantine-core-host.c \
            os/targets/panther/diagnostics/rfs-quarantine-source-host-linux.c \
            os/targets/panther/diagnostics/rfs-quarantine-source-host-linux.test.c \
            -o /tmp/rfs-quarantine-source-host-san
          /tmp/rfs-quarantine-source-host-san

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev

      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo test --workspace
      - name: PID 1 identity fallback
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -Wno-unused-function -Wno-format-truncation
          os/targets/panther/tests/native-init-identity-test.c
          -o /tmp/native-init-identity-test &&
          /tmp/native-init-identity-test
      - name: identity UX contract
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -Wno-unused-function
          os/targets/panther/tests/identity-ux-test.c
          -o /tmp/identity-ux-test &&
          /tmp/identity-ux-test
      - name: e2e
        run: cargo test -p diagnose-slow-system -- --nocapture

  cross-panther:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: enable deb-src
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources 2>/dev/null || sed -i '/^deb /p;s/^deb /deb-src /' /etc/apt/sources.list

      - name: system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates xz-utils git patch dpkg-dev bison \
            meson ninja-build autoconf automake libtool gperf pkg-config \
            libseat-dev libudev-dev libinput-dev libxkbcommon-dev \
            gcc-aarch64-linux-gnu

      - name: cross-compile manual full-RFS quarantine diagnostic
        run: |
          sh os/targets/panther/diagnostics/build-rfs-full-quarantine-owner.sh /tmp
          sh os/targets/panther/diagnostics/build-probe-rfs-full-quarantine.sh /tmp
          file /tmp/modem-rfs-full-quarantine-owner | grep -q 'ARM aarch64'
          file /tmp/modem-rfs-full-quarantine-owner | grep -q 'statically linked'
          file /tmp/probe-handover-rfs-full-quarantine | grep -q 'ARM aarch64'
          file /tmp/probe-handover-rfs-full-quarantine | grep -q 'statically linked'

      - name: install rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: install rust target
        run: rustup target add aarch64-unknown-linux-musl

      - name: install zig
        run: |
          curl -sL -o /tmp/zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          mkdir -p /opt/zig
          tar -C /opt/zig --strip-components=1 -xf /tmp/zig.tar.xz
          echo "ZIG=/opt/zig/zig" >> "$GITHUB_ENV"

      - name: build cross sysroot
        run: os/targets/panther/build-cross-sysroot.sh

      - name: cross-compile saaios runtime and console
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$PWD/os/targets/panther/tools/zig-aarch64-musl.sh"
          export CC_aarch64_unknown_linux_musl="$PWD/os/targets/panther/tools/zig-aarch64-musl.sh"
          export AR_aarch64_unknown_linux_musl="$PWD/os/targets/panther/tools/zig-ar.sh"
          export CRATE_CC_NO_DEFAULTS=1
          export RUSTFLAGS="-C link-self-contained=no"
          cargo build --profile pixel7 --locked --target aarch64-unknown-linux-musl \
            -p saaios-runtime -p console-tui

      - name: cross-compile application platform
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$PWD/os/targets/panther/tools/zig-aarch64-musl.sh"
          export CC_aarch64_unknown_linux_musl="$PWD/os/targets/panther/tools/zig-aarch64-musl.sh"
          export AR_aarch64_unknown_linux_musl="$PWD/os/targets/panther/tools/zig-ar.sh"
          export CRATE_CC_NO_DEFAULTS=1
          export RUSTFLAGS="-C link-self-contained=no"
          cargo build --profile pixel7 --locked --target aarch64-unknown-linux-musl \
            -p saai-appd -p saai-entityd -p saai-demo-surface

      - name: cross-compile saai-displayd
        # Uses the real build path (ADR-013), not a plain `cargo build`:
        # nightly + -Z build-std + panic=immediate-abort, since that's what
        # actually ships -- a plain stable build wouldn't catch a
        # regression that only breaks the size-optimized path.
        run: os/targets/panther/build-saai-displayd.sh

      - name: verify binaries
        run: |
          file target/aarch64-unknown-linux-musl/pixel7/saai-displayd | grep -q 'ARM aarch64'
          file target/aarch64-unknown-linux-musl/pixel7/saai-displayd | grep -q 'statically linked'
          file target/aarch64-unknown-linux-musl/pixel7/saai-demo-surface | grep -q 'ARM aarch64'
          file target/aarch64-unknown-linux-musl/pixel7/saai-appd | grep -q 'ARM aarch64'
          file target/aarch64-unknown-linux-musl/pixel7/saai-appd | grep -q 'statically linked'
          file target/aarch64-unknown-linux-musl/pixel7/saai-entityd | grep -q 'ARM aarch64'
          file target/aarch64-unknown-linux-musl/pixel7/saai-entityd | grep -q 'statically linked'
          file target/aarch64-unknown-linux-musl/pixel7/saaios-runtime | grep -q 'ARM aarch64'
          file target/aarch64-unknown-linux-musl/pixel7/saaios-console | grep -q 'ARM aarch64'
          # init_boot is a fixed 8MB partition shared with everything else
          # already bundled in the ramdisk (ADR-013) -- catch a size
          # regression here rather than at flash time.
          size=$(stat -c%s target/aarch64-unknown-linux-musl/pixel7/saai-displayd)
          echo "saai-displayd size: $size bytes"
          [ "$size" -le 1600000 ]
