name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev
      - name: deterministic graphics preview
        run: bash os/targets/panther/tests/render-preview.sh
      - name: graphics probe compile
        run: cc -std=c11 -Wall -Wextra -Werror os/targets/panther/tools/gpu-probe.c -o /tmp/saaios-gpu-probe -ldl
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: S01 headless Wayland vertical slice
        run: cargo test -p saai-displayd --test wayland_slice -- --nocapture
      - name: e2e
        run: cargo test -p diagnose-slow-system -- --nocapture
