<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Sandbox reveals host /saaios/fonts (ADR-081). Chromium will not
       start a renderer without a default config; Qt widgets tolerate
       a missing one. -->
  <dir>/saaios/fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
</fontconfig>
