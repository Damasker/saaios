[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/event-bus",
    "crates/tool-registry",
    "crates/policy-engine",
    "crates/audit-log",
    "crates/system-tools",
    "crates/model-provider",
    "crates/memory-store",
    "crates/ai-runtime",
    "crates/automation-engine",
    "crates/telemetry",
    "crates/console-tui",
    "services/saaios-runtime",
    "tests/diagnose-slow-system",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["SaaiOS contributors"]
repository = "https://github.com/Damasker/saaios"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
event-bus = { path = "crates/event-bus" }
tool-registry = { path = "crates/tool-registry" }
policy-engine = { path = "crates/policy-engine" }
audit-log = { path = "crates/audit-log" }
system-tools = { path = "crates/system-tools" }
model-provider = { path = "crates/model-provider" }
memory-store = { path = "crates/memory-store" }
ai-runtime = { path = "crates/ai-runtime" }
automation-engine = { path = "crates/automation-engine" }
telemetry = { path = "crates/telemetry" }
console-tui = { path = "crates/console-tui" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
